<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plaža na Ibici u zalasku sunca">
  <defs>
    <linearGradient id="nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d7fa8"/>
      <stop offset="0.55" stop-color="#f3c08a"/>
      <stop offset="1" stop-color="#f8dcae"/>
    </linearGradient>
    <linearGradient id="more" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6c4"/>
      <stop offset="1" stop-color="#0f6f8c"/>
    </linearGradient>
    <linearGradient id="pesak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd1a1"/>
      <stop offset="1" stop-color="#d5a572"/>
    </linearGradient>
    <radialGradient id="sunce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d1"/>
      <stop offset="0.45" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#nebo)"/>
  <circle cx="1130" cy="430" r="230" fill="url(#sunce)"/>
  <circle cx="1130" cy="430" r="62" fill="#fff3d1"/>

  <!-- more -->
  <rect y="460" width="1600" height="300" fill="url(#more)"/>
  <rect x="1050" y="470" width="160" height="6" rx="3" fill="#fff3d1" opacity="0.7"/>
  <rect x="1070" y="490" width="120" height="5" rx="2.5" fill="#fff3d1" opacity="0.55"/>
  <rect x="1090" y="510" width="80" height="5" rx="2.5" fill="#fff3d1" opacity="0.45"/>
  <path d="M0 560 Q200 540 400 560 T800 560 T1200 560 T1600 560" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M0 620 Q200 600 400 620 T800 620 T1200 620 T1600 620" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>

  <!-- pena na obali -->
  <path d="M0 700 Q200 670 420 700 T860 700 T1300 700 T1600 690 L1600 740 L0 740 Z" fill="#ffffff" opacity="0.75"/>

  <!-- pesak -->
  <path d="M0 720 Q400 690 800 720 T1600 710 L1600 900 L0 900 Z" fill="url(#pesak)"/>

  <!-- palma -->
  <g fill="#1d3b34" stroke="#1d3b34">
    <path d="M250 900 Q270 700 330 520" fill="none" stroke-width="14" stroke-linecap="round"/>
    <path d="M330 520 Q250 470 160 520 Q250 500 330 540 Z"/>
    <path d="M330 520 Q310 430 220 400 Q300 440 340 530 Z"/>
    <path d="M330 520 Q380 430 470 420 Q390 450 340 535 Z"/>
    <path d="M330 520 Q430 490 500 540 Q420 520 340 540 Z"/>
    <path d="M330 520 Q330 440 360 380 Q350 450 345 535 Z"/>
